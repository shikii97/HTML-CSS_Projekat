<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Nexcent</title>
  </head>
  <body>
    <!-- NAVIGATION -->
    <nav class="container navigation d-flex flex-row align-items-center mt-3">
      <div class="col-5 d-flex align-items-center">
        <img src="css/slike/Nextcent_icon.png" alt="Nextcent Icon" />
        <h2 class="fw-bold">Nexcent</h2>
      </div>
      <div class="d-flex col-7 justify-content-evenly align-items-center">
        <a>Home</a>
        <a>Features</a>
        <a>Community</a>
        <a>Blog</a>
        <a>Pricing</a>
        <button class="buttonRegisterNow btn btn-success">
          Log in<span class="ms-2">&#8594;</span>
        </button>
      </div>
    </nav>
    <div class="sliderAdBackgroundColor vh-100 d-flex align-items-center">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-6 text-start">
            <h1 class="lessonsAndInsights fw-bold">
              Lessons and insights <br />
              <span class="from8Years fw-bold">from 8 years</span>
            </h1>
            <p class="my-4 text-muted">
              Where to grow your business as a photographer: site or social
              media?
            </p>
            <button class="registerButton btn btn-success px-4 py-2">
              Register
            </button>
          </div>

          <div class="col-md-6 text-center">
            <img
              src="css/slike/Nextcent_Development.png"
              class="img-fluid"
              alt="Nextcent Development Image"
              style="max-height: 400px"
            />
          </div>
        </div>
      </div>
    </div>
    <!-- SCRIPTS -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"
      integrity="sha512-HvOjJrdwNpDbkGJIG2ZNqDlVqMo77qbs4Me4cah0HoDrfhrbA+8SBlZn1KrvAQw7cILLPFJvdwIgphzQmMm+Pw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
